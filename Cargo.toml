[package]
name = "layr"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Annotate images with overlays: boxes, hatched zones, wires, arrows, markers and captions."

[workspace]
resolver = "3"
members = ["vendor/basalt/themes/basalt"]

# Rune is pre-release: pin one `dev` revision for every crate that uses it (Layr and its
# Basalt theme, a git submodule), and patch the crates Rune's root Cargo.toml patches at that same
# revision (Cargo doesn't inherit patches from a dependency).
[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", default-features = false }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", default-features = false }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }

[[bin]]
name = "layr"
path = "src/main.rs"

[dependencies]
rune = { workspace = true, default-features = true, features = ["native-file-dialog"] }
rune-kit = { workspace = true, default-features = true }
# The Basalt theme: the `rune-basalt` crate of the Rune-Basalt submodule.
rune-basalt = { path = "vendor/basalt/themes/basalt" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
fontdb = "0.23"
pdf-writer = "0.15.0"
ttf-parser = "0.25.1"
# Updates: query GitHub releases, download the asset, check it, unpack it.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Picking several images at once (Rune's dialogs pick one file).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
naga = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
