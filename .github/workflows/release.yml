name: Release

# Push a tag such as `v0.1.0` to build Windows, Linux and macOS binaries and publish them
# together in one GitHub release. "Run workflow" builds them without publishing.
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP: layr

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-universal
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The release's version is its tag (`v1.2` or `1.2`): the app reports it, and compares it
      # with the latest release to offer updates, so it must not stay at Cargo.toml's.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "LAYR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Test
        if: runner.os != 'macOS'
        run: cargo test --release --locked

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist/pkg
          cp target/release/$APP.exe README.md dist/pkg/
          cp LICENSE dist/pkg/LICENSE.txt
          cp assets/Inter-LICENSE.txt dist/pkg/
          # A portable zip, and an installer built with Inno Setup.
          (cd dist/pkg && 7z a ../$APP-${{ matrix.name }}-portable.zip .)
          VERSION=${LAYR_VERSION:-$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)}
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup --no-progress -y; fi
          # MSYS_NO_PATHCONV keeps Git Bash from rewriting the /D switches as paths.
          MSYS_NO_PATHCONV=1 "$ISCC" /DAppVersion=$VERSION /DSourceExe=../../target/release/$APP.exe /DOutputDir=../../dist packaging/windows/layr.iss

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir -p dist/$APP
          cp target/release/$APP README.md LICENSE assets/Inter-LICENSE.txt dist/$APP/
          cp assets/icon/icon.png dist/$APP/layr.png
          cp packaging/linux/layr.desktop dist/$APP/
          tar -C dist -czf dist/$APP-${{ matrix.name }}.tar.gz $APP

      - name: Build (macOS universal app)
        if: runner.os == 'macOS'
        run: |
          cargo test --release --locked
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          APPDIR="dist/Layr.app/Contents"
          mkdir -p "$APPDIR/MacOS" "$APPDIR/Resources"
          lipo -create -output "$APPDIR/MacOS/$APP" \
            target/aarch64-apple-darwin/release/$APP target/x86_64-apple-darwin/release/$APP
          VERSION=${LAYR_VERSION:-$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)}
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APPDIR/Info.plist"
          cp LICENSE assets/Inter-LICENSE.txt "$APPDIR/Resources/"
          cp assets/icon/AppIcon.icns "$APPDIR/Resources/"
          # Ad-hoc signature so Apple silicon runs it; it is not notarized.
          codesign --force --deep --sign - "dist/Layr.app"
          # A disk image with the app and a link to Applications to drag it onto.
          mkdir -p dist/dmg
          cp -R "dist/Layr.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Layr $VERSION" -srcfolder dist/dmg -ov -format UDZO dist/$APP-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish every platform's archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Attach to the release if it already exists (e.g. created by hand), else create it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Layr $GITHUB_REF_NAME" \
              --generate-notes
          fi
